benchmarks:
  - image_gen

prompts_file: prompts/cat_bench.yaml
repetitions: 3
concurrency: 2

sampling:
  max_tokens: 512
  temperature: 0.0
  top_p: 1.0

models:
  - provider: openai
    adapter: openai_compat
    model: dall-e-3
    label: "DALL-E 3"
    benchmarks: [image_gen]

  - provider: openai
    adapter: openai_compat
    model: gpt-image-2
    label: "GPT Image 2"
    benchmarks: [image_gen]

  - provider: gemini
    adapter: gemini
    model: gemini-3.1-flash-image-preview
    label: "Nano Banana 2"
    benchmarks: [image_gen]

  - provider: flux
    adapter: flux
    model: flux-2-klein-4b
    label: "FLUX.2 [klein]"
    benchmarks: [image_gen]
