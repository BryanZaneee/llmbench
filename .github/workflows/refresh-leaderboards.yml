name: refresh leaderboards

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC (off-peak)
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SNAPSHOTS_DIR: ${{ runner.temp }}/snapshots
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install llmbench
        run: pip install -e ".[lmarena]"

      - run: mkdir -p "$SNAPSHOTS_DIR"

      # One step per source, each allowed to fail. A source that is rate
      # limited or has changed shape upstream costs its own rows for the day
      # and nothing else; merge_leaderboards.py skips the missing file.
      - name: Fetch huggingface
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: llmbench leaderboard --source huggingface --top 500 --json > "$SNAPSHOTS_DIR/huggingface.json"

      - name: Fetch lmarena
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: llmbench leaderboard --source lmarena --top 500 --json > "$SNAPSHOTS_DIR/lmarena.json"

      - name: Fetch aider
        continue-on-error: true
        run: llmbench leaderboard --source aider --top 200 --json > "$SNAPSHOTS_DIR/aider.json"

      - name: Fetch bundled
        continue-on-error: true
        run: llmbench leaderboard --source bundled --top 500 --json > "$SNAPSHOTS_DIR/bundled.json"

      - name: Merge into all.json
        run: python scripts/merge_leaderboards.py --snapshots "$SNAPSHOTS_DIR"

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/all.json
          if git diff --cached --quiet; then
            echo "No data changes, skipping commit."
            exit 0
          fi
          git commit -m "chore: refresh leaderboard snapshots"
          git push origin HEAD:main
